[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[project]
name = "threadnote"
version = "0.1.0"
description = "Minimalist task management app for programmers."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "PyQt6>=6.5.0",
  "polib>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
threadnote = "threadnote.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threadnote"]

[dependency-groups]
dev = [
    "pillow>=10.4.0",
    "pyinstaller>=6.18.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["E501", "COM812"]  # line too long, handled by formatter; COM812 conflicts with formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
